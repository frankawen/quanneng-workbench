name: 全能工作台爬虫
on:
  # 正式调度已完全迁移到 Supabase pg_cron，直接调用 Edge Function crawler
  # （见 supabase/sql/setup_crawler_cron.sql），本机/本仓库无需参与，也不依赖 PAT。
  # 本 workflow 仅作应急补数据的手动入口：GitHub → Actions → 本流程 → Run workflow。
  # 注意：手动运行请在「北京时间」5/6/12/17 点触发，其它时刻会自动走全量补抓分支。
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install httpx parsel
      
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawlers/crawler.py
