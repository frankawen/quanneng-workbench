name: 全能工作台爬虫
on:
  schedule:
    # 新闻：北京时间 6:00/6:10/6:20/6:30, 12:00/12:10/12:20/12:30, 17:00/17:10/17:20/17:30
    # （GitHub cron 是 UTC 需 -8h → 22,4,9；每档隔 10 分钟连补 4 枪，防 schedule 偶发丢触发）
    - cron: '0,10,20,30 22,4,9 * * *'
    # 诗经/名句/评论：北京时间 5:00/5:10/5:20/5:30（UTC 21:00/21:10/21:20/21:30，连补 4 枪）
    - cron: '0,10,20,30 21 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install httpx parsel
      
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawlers/crawler.py
