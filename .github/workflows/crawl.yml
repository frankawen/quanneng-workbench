name: 全能工作台爬虫
on:
  schedule:
    # 新闻：北京时间 6:00, 12:00, 17:00（GitHub cron 是 UTC，需 -8h → 22,4,9）
    - cron: '0 22,4,9 * * *'
    # 诗经/名句/评论：北京时间 5:00（UTC 21:00）
    - cron: '0 21 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install httpx parsel
      
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawlers/crawler.py
