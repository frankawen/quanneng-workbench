name: 全能工作台爬虫
on:
  # 定时调度已迁移到 Supabase pg_cron（supabase/sql/setup_crawl_cron.sql），
  # 由 Edge Function crawl-scheduler 发 workflow_dispatch 触发本流程。
  # GitHub 自带 schedule 已关闭，避免与 Supabase 双倍触发。
  workflow_dispatch:  # 仅保留手动触发（供 Supabase pg_cron 调用）

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install httpx parsel
      
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawlers/crawler.py
