# ============================================================
# 部署到 GitHub Pages（gh-pages 分支模式）
#
# 背景：本仓库 Pages 发布源 = gh-pages 分支（branch 部署）。
#   旧版工作流用 actions/deploy-pages（要求 Pages 源 = "GitHub Actions"），
#   与 gh-pages 分支模式冲突，导致 2026-11-20 起连续 4 次部署失败，
#   线上长期停留在 2026-09-14 的旧版本。
#
# 现方案：直接把 public/ 静态目录发布到 gh-pages 分支（孤儿提交，历史不膨胀）。
#   用内置 GITHUB_TOKEN，不依赖会过期的 PAT。
#
# 注意：发布的是 public/（当前功能完整的单文件工作台），
#   不是 dist/（React 版仍是骨架，各模块仅占位，功能未迁移，不能上线）。
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy public/ to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
