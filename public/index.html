<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>全能工作台</title>
<style>
:root {
  --paper: #FAF7F2;
  --paper-2: #F3EDE4;
  --paper-3: #EDE7DB;
  --ink: #3D3229;
  --ink-soft: #6E655B;
  --ink-faint: #9A9085;
  --line: #E6DDCF;
  --line-strong: #D8CDB9;
  --accent: #C4704B;
  --accent-soft: #F2E0D4;
  --sage: #6B8E7B;
  --sage-soft: #E8F0EC;
  --gold: #C9A84C;
  --gold-soft: #F5F0DC;
  --pink: #D4A0A0;
  --pink-soft: #F5E6E6;
  --blue: #7A9BB5;
  --blue-soft: #E6EEF4;
  --red: #B23A3A;
  --red-soft: #FBEFE9;
  --radius: 16px;
  --maxw: 960px;
  --shadow-xs: 0 1px 2px rgba(61,50,41,0.04);
  --shadow-sm: 0 2px 8px rgba(61,50,41,0.06);
  --shadow-md: 0 4px 16px rgba(61,50,41,0.08);
  --shadow-lg: 0 8px 30px rgba(61,50,41,0.12);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: var(--ink); background: var(--paper); line-height: 1.6; font-size: 15px; }

/* ⑦ 自定义滚动条 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

.app { display: flex; min-height: 100vh; }

/* ② 侧边栏 — 毛玻璃效果 */
.sidebar { width: 220px; flex: 0 0 220px; background: rgba(243,237,228,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-right: 1px solid var(--line); padding: 24px 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 48px; background: linear-gradient(transparent, rgba(243,237,228,0.9)); pointer-events: none; }
.brand { padding: 0 18px 22px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.brand-name { font-size: 18px; font-weight: 600; color: var(--ink); letter-spacing: 1px; }
.brand-sub { font-size: 11px; color: var(--ink-faint); letter-spacing: 2px; margin-top: 2px; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.nav-btn { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; cursor: pointer; background: transparent; border: none; padding: 10px 12px; border-radius: 10px; color: var(--ink-soft); font-size: 14px; transition: all 0.2s var(--ease-out); position: relative; }
.nav-btn:hover { background: var(--paper-3); color: var(--ink); padding-left: 16px; }
.nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: var(--shadow-xs); }
.nav-btn svg { width: 18px; height: 18px; flex: 0 0 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.side-foot { margin-top: auto; padding: 16px 18px 8px; font-size: 11px; color: var(--ink-faint); line-height: 1.7; }

/* 主内容区 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: rgba(250,247,242,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; }
.content { max-width: var(--maxw); width: 100%; margin: 0 auto; padding: 28px 24px 80px; }

/* ⑪ 模块切换转场动画 */
.module { display: none; }
.module.active { display: block; animation: slideInRight 0.35s var(--ease-out); }
.module.active.from-tabbar { animation: slideInUp 0.35s var(--ease-out); }
@keyframes slideInRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

/* 头部 */
.mhead { margin-bottom: 20px; }
.mhead h1 { font-size: 26px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.mhead p { color: var(--ink-soft); font-size: 13px; }

/* ③ 卡片悬浮微交互 */
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out); }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.card-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }

/* ④ 统计卡片 — 渐变彩条 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; position: relative; overflow: hidden; transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out); }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.stat::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--line-strong); }
.stat.accent::before { background: linear-gradient(90deg, #C4704B, #E0926D); }
.stat.sage::before { background: linear-gradient(90deg, #6B8E7B, #8BAE9A); }
.stat.gold::before { background: linear-gradient(90deg, #C9A84C, #E0C770); }
.stat.pink::before { background: linear-gradient(90deg, #D4A0A0, #E8BCBC); }
.stat.blue::before { background: linear-gradient(90deg, #7A9BB5, #9BB8D0); }
.stat-label { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 600; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-unit { font-size: 13px; color: var(--ink-faint); font-weight: 400; margin-left: 2px; }
.stat.accent .stat-value { color: var(--accent); }
.stat.sage .stat-value { color: var(--sage); }
.stat.gold .stat-value { color: var(--gold); }
.stat.pink .stat-value { color: var(--pink); }

/* 按钮 */
.btn { border: 1px solid var(--line-strong); background: #fff; color: var(--ink); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; transition: all 0.15s; min-height: 42px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #A85A3A; border-color: #A85A3A; }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 8px; }

/* ⑨ 输入框聚焦光晕 */
input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; background: #fff; width: 100%; transition: border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(196,112,75,0.12); }
label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 5px; }
.field { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* 操作行 */
.addrow { display: flex; align-items: center; gap: 10px; margin: 12px 0 6px; flex-wrap: wrap; }

/* 面板 */
.panel { border: 1px solid var(--line); background: var(--paper-2); border-radius: var(--radius); padding: 18px; margin: 8px 0 18px; display: none; }
.panel.open { display: block; }

/* 筛选标签 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
.chip { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; min-height: 34px; transition: all 0.15s; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

/* 列表 — ③ hover 左侧滑入 accent 线 */
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: flex-start; position: relative; transition: padding-left 0.2s var(--ease-out); }
.item:hover { padding-left: 8px; }
.item::before { content: ''; position: absolute; left: -4px; top: 50%; transform: translateY(-50%); width: 3px; height: 0; background: var(--accent); border-radius: 2px; transition: height 0.2s var(--ease-out); }
.item:hover::before { height: 70%; }
.item:last-child { border-bottom: none; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-size: 15px; color: var(--ink); margin-bottom: 3px; font-weight: 500; }
.item-meta { font-size: 12px; color: var(--ink-faint); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
.item-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.linkbtn { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 12px; padding: 4px 6px; border-radius: 4px; }
.linkbtn:hover { color: var(--accent); text-decoration: underline; }

/* 标签 */
.tag { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 12px; background: var(--paper-3); color: var(--ink-soft); }
.tag-pink { background: var(--pink-soft); color: var(--pink); }
.tag-sage { background: var(--sage-soft); color: var(--sage); }
.tag-gold { background: var(--gold-soft); color: var(--gold); }
.tag-blue { background: var(--blue-soft); color: var(--blue); }

/* ⑫ 空状态插画化 */
.empty { padding: 48px 10px 32px; text-align: center; color: var(--ink-faint); font-size: 14px; }
.empty .empty-illu { width: 80px; height: 80px; margin: 0 auto 16px; opacity: 0.5; }
.empty .empty-illu svg { width: 100%; height: 100%; stroke: var(--ink-faint); fill: none; stroke-width: 1.5; }
.empty .empty-title { font-size: 15px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 500; }
.empty .empty-desc { font-size: 12px; color: var(--ink-faint); margin-bottom: 16px; }
.empty .empty-btn { display: inline-flex; align-items: center; gap: 4px; }

/* ⑧ Toast — 带图标+进度条 */
.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(10px); background: var(--ink); color: #fff; padding: 12px 20px 10px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.25s var(--ease-out); z-index: 100; max-width: 90vw; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-lg); min-width: 160px; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast .toast-icon { width: 18px; height: 18px; flex: 0 0 18px; }
.toast .toast-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; }
.toast.success { background: #4A7A5E; }
.toast.error { background: #B23A3A; }
.toast.warning { background: #C9A84C; }
.toast.info { background: var(--ink); }
.toast .toast-progress { position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.5); border-radius: 0 0 12px 12px; animation: toastProgress 2s linear forwards; }
@keyframes toastProgress { from { width: 100%; } to { width: 0%; } }

/* ⑩ 自定义确认弹窗 — 入场动画+遮罩模糊 */
.modal-mask { position: fixed; inset: 0; background: rgba(61,50,41,0.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s var(--ease-out); }
.modal-mask.open { display: flex; }
.modal-box { background: #fff; border-radius: 16px; padding: 24px 22px 18px; width: min(320px, 86vw); box-shadow: var(--shadow-lg); animation: popIn 0.25s var(--ease-spring); }
@keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.25s ease; }
.modal-text { font-size: 15px; color: var(--ink); margin-bottom: 18px; text-align: center; line-height: 1.6; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; justify-content: center; }

/* Banner */
.banner { display: none; align-items: center; gap: 12px; background: var(--red-soft); border: 1px solid #ECC9BC; color: var(--red); padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }
.banner.show { display: flex; }

/* 图表容器 */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 16px; }
.chart-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.chart-box h3 { font-size: 14px; margin-bottom: 12px; font-weight: 600; }
.chart-area { height: 180px; position: relative; }
canvas { width: 100% !important; height: 100% !important; }

/* ⑤ 热力图 — GitHub 风格 + sage 配色 */
.heatmap-wrap { position: relative; padding: 8px 0 0 28px; }
.heatmap-labels { position: absolute; left: 0; top: 8px; display: flex; flex-direction: column; justify-content: space-between; height: calc(100% - 12px); font-size: 10px; color: var(--ink-faint); padding: 2px 0; }
.heatmap-months { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint); margin-left: 28px; margin-bottom: 4px; }
.heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.heat-cell { aspect-ratio: 1; border-radius: 4px; background: var(--paper-3); transition: transform 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out); cursor: pointer; position: relative; }
.heat-cell:hover { transform: scale(1.2); z-index: 2; box-shadow: 0 2px 6px rgba(61,50,41,0.15); }
.heat-cell.l1 { background: #D4E4DA; }
.heat-cell.l2 { background: #A8C9B6; }
.heat-cell.l3 { background: #6B8E7B; }
.heat-cell.l4 { background: #4A7A5E; }
.heat-cell.l5 { background: #2D5A3D; }
.heat-cell[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 10px; padding: 3px 6px; border-radius: 4px; white-space: nowrap; z-index: 10; pointer-events: none; }

/* 诗经卡片 */
.poem-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; border-left: 3px solid var(--pink); }
.poem-title { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
.poem-content { font-size: 15px; line-height: 2; color: var(--ink-soft); }
.poem-section { font-size: 12px; color: var(--ink-faint); margin-top: 10px; }

/* 名句卡片 */
.quote-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }
.quote-text { font-size: 15px; line-height: 1.7; color: var(--ink); margin-bottom: 8px; padding-left: 14px; border-left: 2px solid var(--blue); }
.quote-author { font-size: 13px; color: var(--ink-faint); }

/* 新闻列表 */
.news-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.news-item:last-child { border-bottom: none; }
.news-num { font-size: 22px; font-weight: 600; color: var(--pink); min-width: 26px; }
.news-body { flex: 1; }
.news-title { font-size: 14px; color: var(--ink); margin-bottom: 4px; line-height: 1.5; }
.news-meta { font-size: 12px; color: var(--ink-faint); }

/* 评论卡片 */
.comment-item { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fff; transition: all 0.15s; text-decoration: none; color: inherit; display: block; }
.comment-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.comment-title { font-size: 14px; color: var(--ink); margin-bottom: 6px; font-weight: 500; }
.comment-meta { font-size: 12px; color: var(--ink-faint); }

/* 每日一读合一版式 */
.daily-section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
.daily-section-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.daily-label { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.daily-subtitle { font-size: 13px; color: var(--ink-soft); font-weight: 400; }
.daily-body-text { font-size: 15px; line-height: 2; color: var(--ink-soft); padding: 10px 14px; background: var(--paper-2); border-radius: 8px; margin-bottom: 8px; }
.daily-footer { font-size: 12px; color: var(--ink-faint); }
.daily-footer a { color: var(--accent); text-decoration: none; }
.quote-body-text { font-size: 16px; line-height: 1.9; color: var(--ink); padding-left: 14px; border-left: 3px solid var(--blue); margin: 4px 0 8px; font-weight: 500; }
.quote-author { font-size: 13px; color: var(--ink-faint); text-align: right; margin-bottom: 10px; }
.quote-fields { background: var(--paper-2); border-radius: 8px; padding: 10px 12px; margin-top: 4px; }
.quote-field { display: flex; gap: 8px; font-size: 13px; line-height: 1.65; margin-bottom: 6px; }
.quote-field:last-child { margin-bottom: 0; }
.quote-field-label { flex: 0 0 34px; font-weight: 600; color: var(--accent); }
.quote-field-body { flex: 1; color: var(--ink-soft); }
.quote-meta-row { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
.quote-analysis { font-size: 13px; color: var(--ink-soft); line-height: 1.7; margin-top: 6px; }

/* 新闻四板块 — 杂志式版面（头条+列表分栏） */
.news-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.news-tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); background: #fff; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-soft); transition: all 0.2s var(--ease-out); font-family: inherit; }
.news-tab:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.news-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow-sm); }
.news-tab svg { width: 14px; height: 14px; flex: 0 0 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.news-tab .tab-count { background: rgba(255,255,255,0.25); padding: 1px 7px; border-radius: 8px; font-size: 11px; font-weight: 500; }
.news-tab:not(.active) .tab-count { background: var(--paper-3); color: var(--ink-faint); }

.news-section { margin-bottom: 22px; }
.news-section-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--section-bg, var(--accent-soft)); border-radius: 10px; margin-bottom: 14px; }
.news-section-icon { width: 26px; height: 26px; flex: 0 0 26px; display: flex; align-items: center; justify-content: center; border-radius: 7px; background: var(--section-color, var(--accent)); color: #fff; }
.news-section-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.news-section-name { font-size: 15px; font-weight: 600; color: var(--ink); }
.news-section-count { font-size: 12px; color: var(--ink-faint); margin-left: auto; }

/* 头条大卡 — 标题区/内容区上下分栏 */
.news-hero { display: block; padding: 20px 22px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: inherit; transition: all 0.2s var(--ease-out); margin-bottom: 10px; position: relative; overflow: hidden; }
.news-hero:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--section-color, var(--accent)); }
.news-hero::before { content: '头条'; position: absolute; top: 0; right: 0; background: var(--section-color, var(--accent)); color: #fff; font-size: 10px; padding: 3px 10px; border-radius: 0 0 0 8px; font-weight: 600; letter-spacing: 0.5px; }
/* 标题区：独占一行，与内容区用分隔线隔开 */
.news-hero-title { font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.4; padding: 2px 40px 12px 0; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
/* 内容区：摘要精简为 2 行 */
.news-hero-desc { font-size: 14px; color: var(--ink-soft); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; }
.news-hero-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-faint); }
.news-hero-meta .read-more { margin-left: auto; color: var(--section-color, var(--accent)); font-weight: 500; }

<script>

const CFG = {
  SUPABASE_URL: 'https://wentfvkdfecrfelgmdix.supabase.co',

  AGNES_URL: 'https://apihub.agnes-ai.com/v1',
  AGNES_MODEL: 'agnes-2.5-flash'
};

// 构建版本戳（用于确认浏览器是否加载了最新版；改版时递增）
const BUILD_VERSION = '2026-08-24h';

// ============================================================
// Supabase 工具函数（带重试和详细错误）
// ============================================================
async function sbFetch(url, opts = {}, retry = 3) {
  for (let i = 0; i < retry; i++) {
    // 关键：必须展开 ...opts，否则 method(POST/DELETE/PATCH) 与 body 会丢失，
    // fetch 退化成 GET——写操作"假成功"（返回200但什么都不改）的元凶
    const res = await fetch(url, {
      cache: 'no-store',
      ...opts,
      headers: {
        'apikey': CFG.SUPABASE_KEY,
        'Authorization': `Bearer ${CFG.SUPABASE_KEY}`,
        'Accept': 'application/json',
        ...(opts.headers || {})
      }
    });
    if (res.ok) {
      // 204/空响应（如 DELETE）没有 body，res.json() 会抛错，这里安全处理
      const text = await res.text().catch(() => '');
      return text ? JSON.parse(text) : null;
    }
    // 非网络错误不重试
    if (res.status < 500) {
      const text = await res.text().catch(() => '');
      throw new Error(`API ${res.status}: ${text.slice(0, 200)}`);
    }
    // 5xx 错误，等一下重试
    if (i < retry - 1) await new Promise(r => setTimeout(r, 800 * (i + 1)));
  }
  throw new Error('请求失败，请检查网络');
}

async function sbQuery(table, opts = {}) {
  let url = `${CFG.SUPABASE_URL}/rest/v1/${table}?`;
  const qs = [];
  if (opts.order) qs.push(`order=${encodeURIComponent(opts.order.replace(' ', '.'))}`);
  if (opts.limit) qs.push(`limit=${opts.limit}`);
  if (opts.filter) {
    const f = opts.filter;
    if (f.property && f.operator) {
      if (typeof f.value === 'boolean') {
        // 布尔值必须用 is 操作符：purchased.is.false
        qs.push(`${f.property}.is.${f.value}`);
      } else if (typeof f.value === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(f.value)) {
        // UUID 类型的值不加引号（PostgREST 会报语法错误）
        qs.push(`${f.property}.${f.operator}.${f.value}`);
      } else {
        qs.push(`${f.property}.${f.operator}.${encodeURIComponent(JSON.stringify(f.value))}`);
      }
    }
  }
  if (qs.length) url += qs.join('&');
  return sbFetch(url);
}

async function sbInsert(table, data) {
  return sbFetch(`${CFG.SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'return=representation' },

  });
}

  });
}

async function sbDelete(table, id) {

  });
}

function fmtDate(s) { if (!s) return ''; const p = s.slice(0,10).split('-'); return `${p[1]}月${parseInt(p[2])}日`; }
function fmtMoney(n) { if (!n) return '¥0.00'; return '¥' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function monthStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

let toastTimer;
function toast(msg, type = 'info') {
  const t = $('toast');
  const icons = {
    success: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
    error: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',

  };

// 自定义确认弹窗（替代 confirm()，兼容内嵌/网页视图环境；返回 Promise<boolean>）
function confirmDialog(msg) {
  return new Promise(resolve => {
    const mask = $('confirm-mask');
    $('confirm-text').textContent = msg;
    mask.classList.add('open');
    const done = v => {
      mask.classList.remove('open');
      $('confirm-yes').onclick = null;
      $('confirm-no').onclick = null;
      resolve(v);
    };
    $('confirm-yes').onclick = () => done(true);
    $('confirm-no').onclick = () => done(false);
    // 点遮罩 = 取消
    mask.onclick = e => { if (e.target === mask) done(false); };
  });
}

let lastNavSource = 'sidebar'; // 记录上次触发源，决定转场方向

function switchModule(mod, source) {
  if (source) lastNavSource = source;
  currentModule = mod;
  document.querySelectorAll('.nav-btn, .tabbar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mod === mod);
  });
  const target = document.getElementById(`mod-${mod}`);
  if (!target) return;
  
  // 移除所有模块的 active，加上转场类
  document.querySelectorAll('.module').forEach(m => {
    m.classList.remove('active', 'from-tabbar');
  });
  
  // 强制 reflow 让动画重新触发
  void target.offsetWidth;
  target.classList.add('active');
  if (lastNavSource === 'tabbar') target.classList.add('from-tabbar');
  
  // ⑦ 平滑滚动回顶
  const main = document.querySelector('.main');
  if (main) main.scrollTo({ top: 0, behavior: 'smooth' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  if (!loaded[mod]) {
    loaded[mod] = true;
    loadModule(mod);
  }
}

}

// ⑥ 甜甜圈图 — 交互式消费结构
function renderDonutChart(expenses) {
  const canvas = $('fn-pie');
  if (!canvas) return;
  const m = monthStr();
  const expByCat = {};
  expenses.filter(e => (e.date||'').startsWith(m) && e.type === '支出').forEach(e => {
    const cat = e.category || '其他';
    expByCat[cat] = (expByCat[cat] || 0) + Number(e.amount);
  });
  const total = Object.values(expByCat).reduce((a,b) => a+b, 0);
  const entries = Object.entries(expByCat).sort((a,b) => b[1]-a[1]);
  const colors = ['#C4704B','#6B8E7B','#C9A84C','#D4A0A0','#7A9BB5','#B23A3A','#9A9085'];
  canvas.innerHTML = '';
  if (entries.length === 0) { canvas.innerHTML = '<span style="font-size:13px;color:var(--ink-faint);">暂无支出数据</span>'; return; }

  const size = 200;
  const center = size / 2;
  const outerR = 85, innerR = 55;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', size); svg.setAttribute('height', size);
  svg.style.width = '100%'; svg.style.maxWidth = '200px'; svg.style.margin = '0 auto';

  entries.forEach(([cat, amt], i) => {
    const pct = total > 0 ? amt / total : 0;
    const angle = pct * 2 * Math.PI;
    const startAngle = i > 0 ? entries.slice(0, i).reduce((s,e) => s + (total > 0 ? e[1]/total : 0) * 2 * Math.PI, 0) : 0;
    const r1 = outerR, r2 = innerR;
    const x1 = center + r1 * Math.cos(startAngle - Math.PI/2);
    const y1 = center + r1 * Math.sin(startAngle - Math.PI/2);
    const x2 = center + r2 * Math.cos(startAngle - Math.PI/2);
    const y2 = center + r2 * Math.sin(startAngle - Math.PI/2);
    const x3 = center + r2 * Math.cos(startAngle - angle - Math.PI/2);
    const y3 = center + r2 * Math.sin(startAngle - angle - Math.PI/2);
    const x4 = center + r1 * Math.cos(startAngle - angle - Math.PI/2);
    const y4 = center + r1 * Math.sin(startAngle - angle - Math.PI/2);
    const largeArc = angle > Math.PI ? 1 : 0;
    const path = `${x1},${y1} A ${r1},${r1} 0 ${largeArc},0 ${x4},${y4} L ${x3},${y3} A ${r2},${r2} 0 ${largeArc},1 ${x2},${y2} Z`;
    const pathEl = document.createElementNS(ns, 'path');
    pathEl.setAttribute('d', path);
    pathEl.setAttribute('fill', colors[i % colors.length]);
    pathEl.setAttribute('stroke', '#fff');
    pathEl.setAttribute('stroke-width', '2');
    pathEl.style.cursor = 'pointer';
    pathEl.style.transition = 'opacity 0.2s';
    pathEl.title = `${cat}：${fmtMoney(amt)} (${Math.round(pct*100)}%)`;
    pathEl.addEventListener('mouseenter', () => pathEl.style.opacity = '0.7');
    pathEl.addEventListener('mouseleave', () => pathEl.style.opacity = '1');
    svg.appendChild(pathEl);
  });

  // 中心文字
  const text = document.createElementNS(ns, 'text');
  text.setAttribute('x', center); text.setAttribute('y', center - 6);
  text.setAttribute('text-anchor', 'middle'); text.setAttribute('fill', 'var(--ink)');
  text.setAttribute('font-size', '13'); text.setAttribute('font-weight', '600');
  text.textContent = fmtMoney(total).replace('¥','');
  svg.appendChild(text);
  const sub = document.createElementNS(ns, 'text');
  sub.setAttribute('x', center); sub.setAttribute('y', center + 12);
  sub.setAttribute('text-anchor', 'middle'); sub.setAttribute('fill', 'var(--ink-faint)');
  sub.setAttribute('font-size', '11');
  sub.textContent = '本月支出';
  svg.appendChild(sub);

  // 挂载前先清空画布（移除旧 svg 与旧图例）
  canvas.innerHTML = '';
  canvas.style.cssText = 'height:auto;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  canvas.appendChild(svg);

  // 图例（svg 挂载后再插入，父节点必存在）
  entries.forEach(([cat, amt], i) => {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-top:4px;width:100%;max-width:200px;';
    div.innerHTML = `<span style="width:10px;height:10px;border-radius:3px;background:${colors[i%colors.length]};flex-shrink:0;"></span><span>${cat}</span><span style="margin-left:auto;color:var(--ink-faint);">${fmtMoney(amt)} · ${Math.round(amt/total*100)}%</span>`;
    canvas.appendChild(div);
  });
}

let _habitBusy = false;
async function checkHabit(habitId, date) {
  if (_habitBusy) return;            // 防快速连点导致的并发竞态（两次 loadHabits 重渲染互相覆盖）
  _habitBusy = true;
  try {
    const recs = await sbQuery('habit_records', { filter: { property: 'habit_id', operator: 'eq', value: habitId } });
    // 关键修复：必须同时按 habit_id 与 date 匹配，否则 filter 异常时 recs 含其它习惯记录会误翻第一个
    const rec = recs.find(r => r.habit_id === habitId && r.date === date);
    if (rec) await sbUpdate('habit_records', rec.id, { checked: !rec.checked });
    else await sbInsert('habit_records', { habit_id: habitId, date, checked: true, created_at: new Date().toISOString() });
    toast('已更新'); await loadHabits();
  } catch(e) { toast('操作失败'); }
  finally { _habitBusy = false; }
}

function renderHeatmap(records) {
  const today = new Date();
  const days = 30;
  const heatmap = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayRecs = records.filter(r => r.date === ds);
    const cnt = dayRecs.filter(r => r.checked).length;
    heatmap.push({ date: ds, count: cnt, total: dayRecs.length, dow: d.getDay(), month: d.getMonth(), day: d.getDate() });
  }
  const maxCnt = Math.max(...heatmap.map(d => d.total), 1);
  
  // 月份标签（找每个月第一天的位置）
  const monthLabels = [];
  let lastMonth = -1;
  heatmap.forEach((d, i) => {
    if (d.month !== lastMonth) {
      monthLabels.push({ idx: i, label: `${d.month + 1}月` });
      lastMonth = d.month;
    }
  });
  const monthsEl = $('heatmap-months');
  if (monthsEl) {
    // 简化：显示起始月和结束月
    const firstMonth = heatmap[0].month + 1;
    const lastMonthNum = heatmap[heatmap.length - 1].month + 1;
    if (firstMonth === lastMonthNum) {
      monthsEl.innerHTML = `<span></span><span style="color:var(--ink-soft);">${firstMonth}月</span><span></span>`;
    } else {
      monthsEl.innerHTML = `<span>${firstMonth}月</span><span></span><span>${lastMonthNum}月</span>`;
    }
  }
  
  $('habit-heatmap').innerHTML = heatmap.map(d => {
    const lvl = d.total === 0 ? '' : d.count/maxCnt > 0.8 ? 'l4' : d.count/maxCnt > 0.5 ? 'l3' : d.count/maxCnt > 0.2 ? 'l2' : 'l1';
    const tip = `${d.date}：打卡 ${d.count} 项`;
    return `<div class="heat-cell ${lvl}" data-tip="${tip}" title="${tip}"></div>`;
  }).join('');
}

function renderWeightChart(records) {
  const canvas = $('weight-chart');
  if (!canvas || !records.length) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = 360;
  ctx.scale(2, 2);
  
  const w = canvas.offsetWidth, h = 180;
  const pad = 40;
  const weights = records.map(r => r.weight);
  const maxW = Math.max(...weights, 80);
  const minW = Math.min(...weights, 50);
  const range = maxW - minW || 1;
  
  ctx.clearRect(0, 0, w, h);
  
  // 网格
  ctx.strokeStyle = '#E6DDCF'; ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad + (h - 2*pad) * i / 4;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - 10, y); ctx.stroke();
    ctx.fillStyle = '#9A9085'; ctx.font = '10px sans-serif';
    ctx.fillText((maxW - range * i / 4).toFixed(1), 2, y + 3);
  }
  
  // 折线
  ctx.strokeStyle = '#C4704B'; ctx.lineWidth = 2; ctx.beginPath();
  records.forEach((r, i) => {
    const x = pad + (w - pad - 10) * i / (records.length - 1 || 1);
    const y = pad + (h - 2*pad) * (1 - (r.weight - minW) / range);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // 点
  ctx.fillStyle = '#C4704B';
  records.forEach((r, i) => {
    const x = pad + (w - pad - 10) * i / (records.length - 1 || 1);
    const y = pad + (h - 2*pad) * (1 - (r.weight - minW) / range);
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
  });
}

function renderBMIChart(records, height) {
  const canvas = $('bmi-chart');
  if (!canvas || !records.length) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = 360;
  ctx.scale(2, 2);
  
  const w = canvas.offsetWidth, h = 180;
  const pad = 40;
  const bmiData = records.map(r => r.weight ? r.weight / Math.pow(height/100, 2) : null).filter(v => v);
  const maxB = Math.max(...bmiData, 30);
  const minB = Math.min(...bmiData, 18);
  const range = maxB - minB || 1;
  
  ctx.clearRect(0, 0, w, h);
  
  // 正常范围
  const normTop = pad + (h - 2*pad) * (1 - (24 - minB) / range);
  const normBot = pad + (h - 2*pad) * (1 - (22 - minB) / range);
  ctx.fillStyle = 'rgba(107, 142, 123, 0.1)';
  ctx.fillRect(pad, normTop, w - pad - 10, normBot - normTop);
  
  // 折线
  ctx.strokeStyle = '#6B8E7B'; ctx.lineWidth = 2; ctx.beginPath();
  bmiData.forEach((bmi, i) => {
    const x = pad + (w - pad - 10) * i / (bmiData.length - 1 || 1);
    const y = pad + (h - 2*pad) * (1 - (bmi - minB) / range);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  ctx.fillStyle = '#6B8E7B';
  bmiData.forEach((bmi, i) => {
    const x = pad + (w - pad - 10) * i / (bmiData.length - 1 || 1);
    const y = pad + (h - 2*pad) * (1 - (bmi - minB) / range);
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
  });
}

// 诗经/名句循环索引（基于日期，每天推进一条）
function _cycleIdx(total) {
  if (total <= 0) return 0;
  const epoch = new Date(2026, 0, 1).getTime(); // 2026-01-01 作为起始
  const today = new Date().getTime();
  const days = Math.floor((today - epoch) / 86400000);
  return days % total;
}

// 相对时间显示（"刚刚"/"X 分钟前"/"X 小时前"/"X 天前"/具体日期）
function relTime(ts, now) {
  if (!ts) return '';
  const t = new Date(ts).getTime();
  if (isNaN(t)) return '';
  const diff = Math.max(0, now - t);
  const m = Math.floor(diff / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  const d = Math.floor(h / 24);
  if (d < 7) return d + ' 天前';
  // 一周以上显示日期
  const dt = new Date(ts);
  return `${dt.getMonth()+1}月${dt.getDate()}日`;
}

// 是否为新鲜内容（2 小时内）
function relFresh(ts, now) {
  if (!ts) return '';
  const t = new Date(ts).getTime();
  if (isNaN(t)) return '';
  return (now - t) < 2 * 3600 * 1000 ? 'fresh' : '';
}

      <!-- 名句 -->
      ${quote ? `<div class="daily-section fade-in">
        <div class="daily-section-header">
          <span class="daily-label">名句</span>
          <span class="daily-subtitle">每日一句 · 第 ${(qi+1)}/${(data.quotes||[]).length} 条</span>
        </div>
        <div class="quote-body-text">「${esc(quote.quote)}」</div>
        ${quote.author ? `<div class="quote-author">—— ${esc(quote.author)}</div>` : ''}
        <div class="quote-fields">
          ${quote.translation ? `<div class="quote-field"><span class="quote-field-label">译文</span><span class="quote-field-body">${esc(quote.translation)}</span></div>` : ''}
          ${quote.annotation ? `<div class="quote-field"><span class="quote-field-label">注释</span><span class="quote-field-body">${esc(quote.annotation)}</span></div>` : ''}
          ${quote.analysis ? `<div class="quote-field"><span class="quote-field-label">赏析</span><span class="quote-field-body">${esc(quote.analysis)}</span></div>` : ''}
        </div>
        <div class="daily-footer">
          ${quote.source ? `来源：${esc(quote.source)}` : ''}
          ${quote.url ? `<br><a href="${esc(quote.url)}" target="_blank">前往古诗文网查看原篇及完整释义 ↗</a>` : ''}
        </div>
      </div>` : ''}

      <!-- 评论 -->
      <div class="daily-section fade-in">
        <div class="daily-section-header">
          <span class="daily-label">评论</span>
          <span class="daily-subtitle">人民日报 · 05版 评论 ${comments.length ? '· ' + (comments[0].date||'') : ''}</span>
        </div>
        ${comments.length ? comments.slice(0,5).map(cm => `<a href="${esc(cm.url||'#')}" target="_blank" class="comment-item">
          <div class="comment-title">${esc(cm.title)}</div>
        </a>`).join('') : emptyState('book', '暂无评论', '人民日报评论正在采集，稍后再来看看')}
      </div>

    `;
  } else {
    // 兼容旧 tab 值
    c.innerHTML = '<div class="empty">请选择「新闻」或「每日一读」</div>';
  }
}

// ============================================================
// 图片识别（Agnes AI）
// ============================================================
async function compressImage(file, maxWidth = 800) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

async function recognizeImage(dataUrl, prompt) {
  // 30s 超时（AI 识别通常 3-10s，30s 兜底避免卡死）
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(`${CFG.AGNES_URL}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CFG.AGNES_API_KEY}` },
      body: JSON.stringify({ model: CFG.AGNES_MODEL, messages: [{ role: 'user', content: [
        { type: 'image_url', image_url: { url: dataUrl } },
        { type: 'text', text: prompt }
      ]}] }),
      signal: ctl.signal
    });
    clearTimeout(timer);
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      console.error('Agnes API error:', res.status, errText.slice(0, 300));
      return { ok: false, content: '', error: `HTTP ${res.status}: ${errText.slice(0, 80)}` };
    }
    const data = await res.json();
    const content = data?.choices?.[0]?.message?.content || '';
    return { ok: true, content, error: '' };
  } catch(e) {
    clearTimeout(timer);
    console.error('Recognize error:', e);
    const msg = e.name === 'AbortError' ? '识别超时（>30s）' : (e.message || '网络错误');
    return { ok: false, content: '', error: msg };
  }
}

async function recognizeBill(dataUrl) {
  toast('正在识别账单...', 'info');
  const prompt = '请识别这张账单、发票或消费小票，提取字段并以JSON返回。字段：date(日期YYYY-MM-DD)、merchant(商户)、category(餐饮/交通/购物/娱乐/医疗/教育/其他)、amount(金额数字)、type(支出或收入)、note(备注)。只返回JSON。';
  const { ok, content, error } = await recognizeImage(dataUrl, prompt);
  if (!ok) { toast('识别失败：' + error, 'error'); return; }
  try {
    const match = content.match(/\{[\s\S]*\}/);
    if (match) {
      const j = JSON.parse(match[0]);
      if (j.amount) $('fn-amt').value = j.amount;
      if (j.date) $('fn-date').value = j.date;
      if (j.merchant) $('fn-note').value = j.merchant;
      if (j.type) $('fn-type').value = j.type;
      if (j.category) $('fn-cat').value = j.category;
      $('fn-panel').classList.add('open');
      toast('已识别，请核对后保存', 'success');
    } else {
      console.warn('AI 返回非 JSON:', content.slice(0, 200));
      toast('未识别到有效信息（AI 返回非 JSON）', 'warning');
    }
  } catch(e) { toast('解析失败：' + (e.message||e), 'error'); }
}

async function recognizeWishlist(dataUrl) {
  toast('正在识别商品...', 'info');
  const prompt = '请识别这张图片中的商品，提取商品名称和预估价格。格式：{"name":"商品名","price":价格数字}。只返回JSON。';
  const { ok, content, error } = await recognizeImage(dataUrl, prompt);
  if (!ok) { toast('识别失败：' + error, 'error'); return; }
  try {

// ============================================================
// 事件绑定
// ============================================================
function bindEvents() {
  // 安全绑定：元素缺失只告警，不中断后面所有绑定（避免旧版/缓存 HTML 一个 ID 缺失导致全部按钮失灵）
  const bind = (id, evt, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener(evt, fn);
    else console.warn('bindEvents: 缺少元素 #' + id);
  };

  // 导航
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchModule(btn.dataset.mod, 'sidebar'));
  });
  document.querySelectorAll('.tabbar button').forEach(btn => {
    btn.addEventListener('click', () => switchModule(btn.dataset.mod, 'tabbar'));
  });
  
  // 每日一读标签
  document.querySelectorAll('#read-tabs .chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#read-tabs .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      loadDailyRead(btn.dataset.tab);
    });
  });
  
  // 记账
  bind('fn-add-btn', 'click', () => $('fn-panel').classList.toggle('open'));
  bind('fn-cancel', 'click', () => $('fn-panel').classList.remove('open'));
  bind('fn-budget-btn', 'click', () => $('fn-budget-panel').classList.toggle('open'));
  bind('fn-budget-cancel', 'click', () => $('fn-budget-panel').classList.remove('open'));
  bind('fn-save', 'click', async () => {
    const type = $('fn-type').value;
    const amt = parseFloat($('fn-amt').value);
    const cat = $('fn-cat').value;
    const date = $('fn-date').value || today();
    const note = $('fn-note').value.trim();
    if (isNaN(amt) || amt <= 0) { toast('请输入有效金额'); return; }
    await saveExpense({ type, amount: amt, category: cat, date, note, created_at: new Date().toISOString() });
    $('fn-amt').value = ''; $('fn-note').value = ''; $('fn-panel').classList.remove('open');
  });
  bind('fn-budget-save', 'click', async () => {
    const b = parseFloat($('fn-budget').value);
    if (isNaN(b) || b < 0) { toast('请输入预算'); return; }
    await sbInsert('budgets', { month: monthStr(), amount: b, created_at: new Date().toISOString() });
    toast('预算已保存'); $('fn-budget-panel').classList.remove('open'); await loadFinance();
  });
  bind('fn-snap-btn', 'click', () => $('fn-snap-input').click());
  bind('fn-snap-input', 'change', async e => {
    const f = e.target.files[0];
    if (f) { const d = await compressImage(f); if (d) await recognizeBill(d); }
  });
  
  // 习惯
  bind('habit-add-btn', 'click', () => $('habit-panel').classList.toggle('open'));
  bind('habit-cancel', 'click', () => $('habit-panel').classList.remove('open'));
  bind('habit-save', 'click', async () => {
    const name = $('habit-name').value.trim();
    const type = $('habit-type').value;
    if (!name) { toast('请输入习惯名称'); return; }
    await sbInsert('habits', { name, type, created_at: new Date().toISOString() });
    toast('已添加'); $('habit-name').value = ''; $('habit-panel').classList.remove('open'); await loadHabits();
  });
  
  // 健身
  bind('fitness-add-btn', 'click', () => $('fitness-panel').classList.toggle('open'));
  bind('fitness-cancel', 'click', () => $('fitness-panel').classList.remove('open'));
  bind('fitness-plan-btn', 'click', () => $('fitness-plan-panel').classList.toggle('open'));
  bind('fitness-plan-cancel', 'click', () => $('fitness-plan-panel').classList.remove('open'));
  bind('fitness-save', 'click', async () => {
    const weight = parseFloat($('fitness-weight').value);
    const bodyFat = parseFloat($('fitness-fat').value) || null;
    const height = parseFloat($('fitness-height').value) || 175;
    const note = $('fitness-note').value.trim();
    if (isNaN(weight) || weight <= 0) { toast('请输入有效体重'); return; }
    const bmi = (weight / Math.pow(height/100, 2)).toFixed(1);
    try {
      await sbInsert('body_records', { weight, body_fat: bodyFat, height, bmi: parseFloat(bmi), note, date: today(), created_at: new Date().toISOString() });
      toast('已记录'); $('fitness-panel').classList.remove('open'); await loadFitness();
    } catch(e) { toast('保存失败：' + (e.message||e)); }
  });
  bind('plan-add', 'click', async () => {
    const exercise = $('plan-exercise').value.trim();
    const day = parseInt($('plan-day').value);
    if (!exercise) { toast('请输入运动项目'); return; }
    try {
      await sbInsert('workout_plans', { exercise, day, week: day, created_at: new Date().toISOString() });
      $('plan-exercise').value = ''; toast('已添加'); await loadFitness();
    } catch(e) { toast('保存失败：' + (e.message||e)); }
  });
  
  // 待买
  bind('wl-add-btn', 'click', () => $('wl-panel').classList.toggle('open'));
  bind('wl-cancel', 'click', () => $('wl-panel').classList.remove('open'));
  bind('wl-camera-btn', 'click', () => $('wl-camera-input').click());
  bind('wl-upload-btn', 'click', () => $('wl-upload-input').click());
  bind('wl-camera-input', 'change', async e => { const f = e.target.files[0]; if (f) { const d = await compressImage(f); if (d) await recognizeWishlist(d); } });
  bind('wl-upload-input', 'change', async e => { const f = e.target.files[0]; if (f) { const d = await compressImage(f); if (d) await recognizeWishlist(d); } });
  bind('wl-save', 'click', async () => {
    const name = $('wl-name').value.trim();
    if (!name) { toast('请输入商品名称'); return; }
    await saveWL({ name, price: parseFloat($('wl-price').value) || null, priority: $('wl-priority').value, category: $('wl-cat').value, note: $('wl-note').value.trim(), purchased: false, created_at: new Date().toISOString() });
    $('wl-name').value = ''; $('wl-price').value = ''; $('wl-note').value = ''; $('wl-panel').classList.remove('open');
  });
}
