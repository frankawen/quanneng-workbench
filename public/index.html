<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全能工作台</title>
<style>
:root {
  --paper: #FAF7F2;
  --paper-2: #F3EDE4;
  --paper-3: #EDE7DB;
  --ink: #3D3229;
  --ink-soft: #6E655B;
  --ink-faint: #9A9085;
  --line: #E6DDCF;
  --line-strong: #D8CDB9;
  --accent: #C4704B;
  --accent-soft: #F2E0D4;
  --sage: #6B8E7B;
  --sage-soft: #E8F0EC;
  --gold: #C9A84C;
  --gold-soft: #F5F0DC;
  --pink: #D4A0A0;
  --pink-soft: #F5E6E6;
  --blue: #7A9BB5;
  --blue-soft: #E6EEF4;
  --red: #B23A3A;
  --red-soft: #FBEFE9;
  --radius: 16px;
  --maxw: 960px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: var(--ink); background: var(--paper); line-height: 1.6; font-size: 15px; }
.app { display: flex; min-height: 100vh; }

/* 侧边栏 */
.sidebar { width: 220px; flex: 0 0 220px; background: var(--paper-2); border-right: 1px solid var(--line); padding: 24px 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { padding: 0 18px 22px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.brand-name { font-size: 18px; font-weight: 600; color: var(--ink); letter-spacing: 1px; }
.brand-sub { font-size: 11px; color: var(--ink-faint); letter-spacing: 2px; margin-top: 2px; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.nav-btn { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; cursor: pointer; background: transparent; border: none; padding: 10px 12px; border-radius: 10px; color: var(--ink-soft); font-size: 14px; transition: all 0.15s; }
.nav-btn:hover { background: var(--paper-3); color: var(--ink); }
.nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-btn svg { width: 18px; height: 18px; flex: 0 0 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.side-foot { margin-top: auto; padding: 16px 18px 8px; font-size: 11px; color: var(--ink-faint); line-height: 1.7; }

/* 主内容区 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 10; }
.content { max-width: var(--maxw); width: 100%; margin: 0 auto; padding: 28px 24px 80px; }

/* 模块 */
.module { display: none; }
.module.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* 头部 */
.mhead { margin-bottom: 20px; }
.mhead h1 { font-size: 26px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.mhead p { color: var(--ink-soft); font-size: 13px; }

/* 卡片 */
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
.card-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }

/* 统计卡片 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.stat-label { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 600; color: var(--ink); line-height: 1.1; }
.stat-unit { font-size: 13px; color: var(--ink-faint); font-weight: 400; margin-left: 2px; }
.stat.accent .stat-value { color: var(--accent); }
.stat.sage .stat-value { color: var(--sage); }
.stat.gold .stat-value { color: var(--gold); }
.stat.pink .stat-value { color: var(--pink); }

/* 按钮 */
.btn { border: 1px solid var(--line-strong); background: #fff; color: var(--ink); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; transition: all 0.15s; min-height: 42px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #A85A3A; border-color: #A85A3A; }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 8px; }

/* 输入框 */
input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; background: #fff; width: 100%; transition: border-color 0.15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 5px; }
.field { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* 操作行 */
.addrow { display: flex; align-items: center; gap: 10px; margin: 12px 0 6px; flex-wrap: wrap; }

/* 面板 */
.panel { border: 1px solid var(--line); background: var(--paper-2); border-radius: var(--radius); padding: 18px; margin: 8px 0 18px; display: none; }
.panel.open { display: block; }

/* 筛选标签 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
.chip { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; min-height: 34px; transition: all 0.15s; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

/* 列表 */
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.item:last-child { border-bottom: none; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-size: 15px; color: var(--ink); margin-bottom: 3px; font-weight: 500; }
.item-meta { font-size: 12px; color: var(--ink-faint); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
.item-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.linkbtn { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 12px; padding: 4px 6px; border-radius: 4px; }
.linkbtn:hover { color: var(--accent); text-decoration: underline; }

/* 标签 */
.tag { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 12px; background: var(--paper-3); color: var(--ink-soft); }
.tag-pink { background: var(--pink-soft); color: var(--pink); }
.tag-sage { background: var(--sage-soft); color: var(--sage); }
.tag-gold { background: var(--gold-soft); color: var(--gold); }
.tag-blue { background: var(--blue-soft); color: var(--blue); }

/* 空状态 */
.empty { padding: 32px 10px; text-align: center; color: var(--ink-faint); font-size: 14px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(10px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 24px; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 100; max-width: 90vw; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Banner */
.banner { display: none; align-items: center; gap: 12px; background: var(--red-soft); border: 1px solid #ECC9BC; color: var(--red); padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }
.banner.show { display: flex; }

/* 图表容器 */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 16px; }
.chart-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.chart-box h3 { font-size: 14px; margin-bottom: 12px; font-weight: 600; }
.chart-area { height: 180px; position: relative; }
canvas { width: 100% !important; height: 100% !important; }

/* 热力图 */
.heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 10px; }
.heat-cell { aspect-ratio: 1; border-radius: 3px; background: var(--paper-3); }
.heat-cell.l1 { background: #E8F5E9; }
.heat-cell.l2 { background: #C8E6C9; }
.heat-cell.l3 { background: #81C784; }
.heat-cell.l4 { background: #4CAF50; }
.heat-cell.l5 { background: #2E7D32; }

/* 诗经卡片 */
.poem-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; border-left: 3px solid var(--pink); }
.poem-title { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
.poem-content { font-size: 15px; line-height: 2; color: var(--ink-soft); }
.poem-section { font-size: 12px; color: var(--ink-faint); margin-top: 10px; }

/* 名句卡片 */
.quote-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }
.quote-text { font-size: 15px; line-height: 1.7; color: var(--ink); margin-bottom: 8px; padding-left: 14px; border-left: 2px solid var(--blue); }
.quote-author { font-size: 13px; color: var(--ink-faint); }

/* 新闻列表 */
.news-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.news-item:last-child { border-bottom: none; }
.news-num { font-size: 22px; font-weight: 600; color: var(--pink); min-width: 26px; }
.news-body { flex: 1; }
.news-title { font-size: 14px; color: var(--ink); margin-bottom: 4px; line-height: 1.5; }
.news-meta { font-size: 12px; color: var(--ink-faint); }

/* 评论卡片 */
.comment-item { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fff; transition: all 0.15s; text-decoration: none; color: inherit; display: block; }
.comment-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.comment-title { font-size: 14px; color: var(--ink); margin-bottom: 6px; font-weight: 500; }
.comment-meta { font-size: 12px; color: var(--ink-faint); }

/* 移动端底部导航 */
.tabbar { display: none; }

@media (max-width: 860px) {
  .sidebar { display: none; }
  .topbar { display: flex; }
  .content { padding: 18px 16px 80px; }
  .charts { grid-template-columns: 1fr; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar button { flex: 1; background: none; border: none; cursor: pointer; color: var(--ink-faint); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; padding: 6px 2px; font-family: inherit; }
  .tabbar button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .tabbar button.active { color: var(--accent); }
}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">全能工作台</div>
      <div class="brand-sub">LIFE · WORKSPACE</div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-mod="overview">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        今日概览
      </button>
      <button class="nav-btn" data-mod="finance">
        <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 16l3-4 3 2 4-6"/></svg>
        记账理财
      </button>
      <button class="nav-btn" data-mod="habits">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        习惯健康
      </button>
      <button class="nav-btn" data-mod="fitness">
        <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        减脂健身
      </button>
      <button class="nav-btn" data-mod="wishlist">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/></svg>
        待买清单
      </button>
      <button class="nav-btn" data-mod="read">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        每日一读
      </button>
    </nav>
    <div class="side-foot">数据存于云端 · 多端同步<br>新增/修改/删除即时写回</div>
  </aside>

  <!-- 主内容 -->
  <div class="main">
    <div class="topbar">
      <div class="brand-name" style="font-size:16px;">全能工作台</div>
      <button class="btn btn-sm" onclick="refreshCurrent()" style="margin-left:auto;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0115-6.7L21 8M21 3v5h-5M21 12a9 9 0 01-15 6.7L3 16M3 21v-5h5"/></svg>
        刷新
      </button>
    </div>

    <div class="content">
      <!-- 错误提示 -->
      <div class="banner" id="banner">
        <span id="banner-msg">加载失败</span>
        <button class="btn btn-sm" onclick="retryLoad()">重试</button>
      </div>

      <!-- ========== 今日概览 ========== -->
      <section class="module active" id="mod-overview">
        <div class="mhead">
          <h1>今日概览</h1>
          <p id="today-date"></p>
        </div>
        <div class="card">
          <div class="item-title" id="greet-title" style="font-size:18px;margin-bottom:8px;">早安</div>
          <div class="item-meta" id="greet-text" style="color:var(--ink-soft);"></div>
        </div>
        <div class="stats" id="overview-stats"></div>
        <div class="card">
          <div class="card-title">今天要处理</div>
          <div id="today-todo"></div>
        </div>
      </section>

      <!-- ========== 记账理财 ========== -->
      <section class="module" id="mod-finance">
        <div class="mhead">
          <h1>记账理财</h1>
          <p>收支记录、预算设置、消费结构一目了然</p>
        </div>
        <div class="stats" id="finance-stats"></div>
        <div class="addrow">
          <button class="btn btn-primary btn-sm" id="fn-add-btn">＋ 记一笔</button>
          <button class="btn btn-sm" id="fn-budget-btn">设置预算</button>
          <button class="btn btn-sm" id="fn-snap-btn">📷 拍照识图</button>
          <input type="file" id="fn-snap-input" accept="image/*" style="display:none">
        </div>
        <div class="panel" id="fn-panel">
          <div class="grid3">
            <div class="field"><label>类型</label><select id="fn-type"><option value="支出">支出</option><option value="收入">收入</option></select></div>
            <div class="field"><label>金额（¥）</label><input type="number" id="fn-amt" placeholder="0.00" step="0.01" min="0"></div>
            <div class="field"><label>分类</label><select id="fn-cat"><option>餐饮</option><option>交通</option><option>购物</option><option>娱乐</option><option>医疗</option><option>教育</option><option>工资</option><option>其他</option></select></div>
          </div>
          <div class="field"><label>日期</label><input type="date" id="fn-date"></div>
          <div class="field"><label>备注</label><input type="text" id="fn-note" placeholder="可选"></div>
          <button class="btn btn-primary" id="fn-save">保存</button>
          <button class="btn btn-sm" id="fn-cancel" style="margin-left:8px;">取消</button>
        </div>
        <div class="panel" id="fn-budget-panel">
          <div class="field"><label>本月预算（¥）</label><input type="number" id="fn-budget" placeholder="如 3000"></div>
          <button class="btn btn-primary" id="fn-budget-save">保存预算</button>
          <button class="btn btn-sm" id="fn-budget-cancel" style="margin-left:8px;">取消</button>
        </div>
        <div class="charts">
          <div class="chart-box">
            <h3>本月消费结构</h3>
            <div id="fn-pie" style="height:200px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;"></div>
          </div>
          <div class="chart-box">
            <h3>月度对比</h3>
            <div id="fn-month" style="height:200px;"></div>
          </div>
        </div>
        <div class="chips" id="fn-chips"></div>
        <div class="list" id="fn-list"></div>
      </section>

      <!-- ========== 习惯健康 ========== -->
      <section class="module" id="mod-habits">
        <div class="mhead">
          <h1>习惯健康</h1>
          <p>坚持好习惯，记录每一天</p>
        </div>
        <div class="addrow">
          <button class="btn btn-primary btn-sm" id="habit-add-btn">＋ 新增习惯</button>
        </div>
        <div class="panel" id="habit-panel">
          <div class="field"><label>习惯名称</label><input type="text" id="habit-name" placeholder="如：早起、喝水、运动"></div>
          <div class="field"><label>打卡方式</label>
            <select id="habit-type">
              <option value="check">勾选打卡</option>
              <option value="count">计数打卡</option>
              <option value="value">数值打卡</option>
            </select>
          </div>
          <button class="btn btn-primary" id="habit-save">保存</button>
          <button class="btn btn-sm" id="habit-cancel" style="margin-left:8px;">取消</button>
        </div>
        <div id="habits-list"></div>
        <div class="card" style="margin-top:16px;">
          <div class="card-title">近30天热力图</div>
          <div class="heatmap" id="habit-heatmap"></div>
        </div>
      </section>

      <!-- ========== 减脂健身 ========== -->
      <section class="module" id="mod-fitness">
        <div class="mhead">
          <h1>减脂健身</h1>
          <p>体重追踪、BMI计算、周计划管理</p>
        </div>
        <div class="stats" id="fitness-stats"></div>
        <div class="charts">
          <div class="chart-box">
            <h3>7日体重趋势</h3>
            <canvas id="weight-chart"></canvas>
          </div>
          <div class="chart-box">
            <h3>BMI 曲线</h3>
            <canvas id="bmi-chart"></canvas>
          </div>
        </div>
        <div class="addrow">
          <button class="btn btn-primary btn-sm" id="fitness-add-btn">＋ 记录体重</button>
          <button class="btn btn-sm" id="fitness-plan-btn">编辑周计划</button>
        </div>
        <div class="panel" id="fitness-panel">
          <div class="grid3">
            <div class="field"><label>体重（kg）</label><input type="number" id="fitness-weight" step="0.1" placeholder="65.5"></div>
            <div class="field"><label>体脂率（%）</label><input type="number" id="fitness-fat" step="0.1" placeholder="20.5"></div>
            <div class="field"><label>身高（cm）</label><input type="number" id="fitness-height" step="1" placeholder="175"></div>
          </div>
          <div class="field"><label>备注</label><input type="text" id="fitness-note" placeholder="可选"></div>
          <button class="btn btn-primary" id="fitness-save">保存</button>
          <button class="btn btn-sm" id="fitness-cancel" style="margin-left:8px;">取消</button>
        </div>
        <div class="panel" id="fitness-plan-panel">
          <div id="plan-list"></div>
          <div class="addrow" style="margin-top:12px;">
            <input type="text" id="plan-exercise" placeholder="运动项目" style="flex:1;">
            <select id="plan-day" style="width:80px;"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
            <button class="btn btn-primary btn-sm" id="plan-add">添加</button>
          </div>
          <button class="btn btn-sm" id="fitness-plan-cancel" style="margin-top:12px;">取消</button>
        </div>
        <div class="list" id="fitness-list"></div>
      </section>

      <!-- ========== 待买清单 ========== -->
      <section class="module" id="mod-wishlist">
        <div class="mhead">
          <h1>待买清单</h1>
          <p>记录想买的商品，理性消费不踩坑</p>
        </div>
        <div class="stats" id="wishlist-stats"></div>
        <div class="addrow">
          <button class="btn btn-sm" id="wl-camera-btn">📷 拍照识图</button>
          <button class="btn btn-sm" id="wl-upload-btn">🖼️ 上传图片</button>
          <button class="btn btn-primary btn-sm" id="wl-add-btn">＋ 手动添加</button>

// ============================================================
// Supabase 工具函数
// ============================================================
async function sbQuery(table, opts = {}) {
  let url = `${CFG.SUPABASE_URL}/rest/v1/${table}?`;
  const qs = [];
  if (opts.order) qs.push(`order=${encodeURIComponent(opts.order)}`);
  if (opts.limit) qs.push(`limit=${opts.limit}`);
  if (opts.filter) {
    const f = opts.filter;
    if (f.property && f.operator) {
      qs.push(`${f.property}.${f.operator}=${encodeURIComponent(JSON.stringify(f.value))}`);
    }
  }
  if (qs.length) url += qs.join('&');
  
  const res = await fetch(url, {
    headers: {
      'apikey': CFG.SUPABASE_KEY,
      'Authorization': `Bearer ${CFG.SUPABASE_KEY}`,
      'Accept': 'application/json'
    }
  });
  if (!res.ok) throw new Error(`Query failed: ${res.status}`);
  return res.json();
}

async function sbInsert(table, data) {
  const res = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      'apikey': CFG.SUPABASE_KEY,
      'Authorization': `Bearer ${CFG.SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`Insert failed: ${res.status}`);
  return res.json();
}

async function sbUpdate(table, id, data) {
  const res = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH',
    headers: {
      'apikey': CFG.SUPABASE_KEY,
      'Authorization': `Bearer ${CFG.SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`Update failed: ${res.status}`);
  return res.json();
}

async function sbDelete(table, id) {
  const res = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'DELETE',
    headers: {
      'apikey': CFG.SUPABASE_KEY,
      'Authorization': `Bearer ${CFG.SUPABASE_KEY}`
    }
  });
  if (!res.ok) throw new Error(`Delete failed: ${res.status}`);
}

// ============================================================

function $(id) { return document.getElementById(id); }
function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(s) { if (!s) return ''; const p = s.slice(0,10).split('-'); return `${p[1]}月${parseInt(p[2])}日`; }
function fmtMoney(n) { if (!n) return '¥0.00'; return '¥' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function monthStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

// Toast
let toastTimer;
function toast(msg) {
  const t = $('toast');

async function checkHabit(habitId, date) {
  try {
    const recs = await sbQuery('habit_records', { filter: { property: 'habit_id', operator: 'eq', value: habitId } });
    const rec = recs.find(r => r.date === date);
    if (rec) await sbUpdate('habit_records', rec.id, { checked: !rec.checked });
    else await sbInsert('habit_records', { habit_id: habitId, date, checked: true, created_at: new Date().toISOString() });
    toast('已更新'); loadHabits();
  } catch(e) { toast('操作失败'); }
}

async function incHabit(habitId, date, delta) {
  try {
    const recs = await sbQuery('habit_records', { filter: { property: 'habit_id', operator: 'eq', value: habitId } });
    const rec = recs.find(r => r.date === date);
    const newCount = Math.max(0, (rec?.count || 0) + delta);
    if (rec) await sbUpdate('habit_records', rec.id, { count: newCount });
    else await sbInsert('habit_records', { habit_id: habitId, date, count: newCount, created_at: new Date().toISOString() });
    loadHabits();
  } catch(e) { toast('操作失败'); }
}

    const recs = await sbQuery('habit_records', { filter: { property: 'habit_id', operator: 'eq', value: habitId } });
    const rec = recs.find(r => r.date === date);
    if (rec) await sbUpdate('habit_records', rec.id, { value: val });
    else await sbInsert('habit_records', { habit_id: habitId, date, value: val, created_at: new Date().toISOString() });
    toast('已保存'); loadHabits();
  } catch(e) { toast('保存失败'); }
}

function renderHeatmap(records) {
  const today = new Date();
  const days = 30;
  const heatmap = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayRecs = records.filter(r => r.date === ds);
    const cnt = dayRecs.filter(r => r.checked).length;
    heatmap.push({ date: ds, count: cnt, total: dayRecs.length });
  }
  const maxCnt = Math.max(...heatmap.map(d => d.total), 1);
  $('habit-heatmap').innerHTML = heatmap.map(d => {
    const lvl = d.total === 0 ? '' : d.count/maxCnt > 0.8 ? 'l4' : d.count/maxCnt > 0.5 ? 'l3' : d.count/maxCnt > 0.2 ? 'l2' : 'l1';
    return `<div class="heat-cell ${lvl}" title="${d.date}: ${d.count}/${d.total}"></div>`;
  }).join('');
}

function renderWeightChart(records) {
  const canvas = $('weight-chart');
  if (!canvas || !records.length) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = 360;
  ctx.scale(2, 2);
  
  const w = canvas.offsetWidth, h = 180;
  const pad = 40;
  const weights = records.map(r => r.weight);
  const maxW = Math.max(...weights, 80);
  const minW = Math.min(...weights, 50);
  const range = maxW - minW || 1;
  
  ctx.clearRect(0, 0, w, h);
  
  // 网格
  ctx.strokeStyle = '#E6DDCF'; ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad + (h - 2*pad) * i / 4;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - 10, y); ctx.stroke();
    ctx.fillStyle = '#9A9085'; ctx.font = '10px sans-serif';
    ctx.fillText((maxW - range * i / 4).toFixed(1), 2, y + 3);
  }
  
  // 折线
  ctx.strokeStyle = '#C4704B'; ctx.lineWidth = 2; ctx.beginPath();
  records.forEach((r, i) => {
    const x = pad + (w - pad - 10) * i / (records.length - 1 || 1);
    const y = pad + (h - 2*pad) * (1 - (r.weight - minW) / range);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // 点
  ctx.fillStyle = '#C4704B';
  records.forEach((r, i) => {
    const x = pad + (w - pad - 10) * i / (records.length - 1 || 1);
    const y = pad + (h - 2*pad) * (1 - (r.weight - minW) / range);
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
  });
}

function renderBMIChart(records, height) {
  const canvas = $('bmi-chart');
  if (!canvas || !records.length) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = 360;
  ctx.scale(2, 2);
  
  const w = canvas.offsetWidth, h = 180;
  const pad = 40;
  const bmiData = records.map(r => r.weight ? r.weight / Math.pow(height/100, 2) : null).filter(v => v);
  const maxB = Math.max(...bmiData, 30);
  const minB = Math.min(...bmiData, 18);
  const range = maxB - minB || 1;
  
  ctx.clearRect(0, 0, w, h);
  
  // 正常范围
  const normTop = pad + (h - 2*pad) * (1 - (24 - minB) / range);
  const normBot = pad + (h - 2*pad) * (1 - (22 - minB) / range);
  ctx.fillStyle = 'rgba(107, 142, 123, 0.1)';
  ctx.fillRect(pad, normTop, w - pad - 10, normBot - normTop);
  
  // 折线
  ctx.strokeStyle = '#6B8E7B'; ctx.lineWidth = 2; ctx.beginPath();
  bmiData.forEach((bmi, i) => {
    const x = pad + (w - pad - 10) * i / (bmiData.length - 1 || 1);
    const y = pad + (h - 2*pad) * (1 - (bmi - minB) / range);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  ctx.fillStyle = '#6B8E7B';
  bmiData.forEach((bmi, i) => {
    const x = pad + (w - pad - 10) * i / (bmiData.length - 1 || 1);
    const y = pad + (h - 2*pad) * (1 - (bmi - minB) / range);
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
  });
}

async function loadWishlist() {
  try {
    const items = await sbQuery('wishlist', { order: 'created_at desc', limit: 100 });
    const want = items.filter(i => !i.purchased);
    const total = want.reduce((s,i) => s + (Number(i.price)||0), 0);
    
    $('wishlist-stats').innerHTML = [
      { label: '待买件数', value: want.length, cls: 'accent' },
      { label: '预估合计', value: fmtMoney(total), cls: 'gold' },
      { label: '已购买', value: items.length - want.length, cls: 'sage' },
      { label: '总计', value: items.length, cls: 'blue' }
    ].map(s => `<div class="stat ${s.cls}"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>`).join('');
    
    const chips = ['全部','想买','已买','高','中','低'];

    $('wl-chips').innerHTML = chips.map(c => `<button class="chip ${c===active?'active':''}" onclick="filterWL('${c}')">${c}</button>`).join('');

    console.error('Wishlist error:', e);

// ============================================================
// 图片识别（Agnes AI）
// ============================================================
async function compressImage(file, maxWidth = 800) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

async function recognizeImage(dataUrl, prompt) {
  try {
    const res = await fetch(`${CFG.AGNES_URL}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CFG.AGNES_API_KEY}` },
      body: JSON.stringify({ model: CFG.AGNES_MODEL, messages: [{ role: 'user', content: [
        { type: 'image_url', image_url: { url: dataUrl } },
        { type: 'text', text: prompt }
      ]}] })
    });
    const data = await res.json();
    return data?.choices?.[0]?.message?.content || '';
  } catch(e) { console.error('Recognize error:', e); return ''; }
}

async function recognizeBill(dataUrl) {
  toast('正在识别账单...');
  const prompt = '请识别这张账单、发票或消费小票，提取字段并以JSON返回。字段：date(日期YYYY-MM-DD)、merchant(商户)、category(餐饮/交通/购物/娱乐/医疗/教育/其他)、amount(金额数字)、type(支出或收入)、note(备注)。只返回JSON。';
  const result = await recognizeImage(dataUrl, prompt);
  try {
    const match = result.match(/\{[\s\S]*\}/);
    if (match) {
      const j = JSON.parse(match[0]);
      if (j.amount) $('fn-amt').value = j.amount;
      if (j.date) $('fn-date').value = j.date;
      if (j.merchant) $('fn-note').value = j.merchant;
      if (j.type) $('fn-type').value = j.type;
      if (j.category) $('fn-cat').value = j.category;
      $('fn-panel').classList.add('open');
      toast('已识别，请核对后保存');
    } else toast('未识别到有效信息');
  } catch(e) { toast('识别失败'); }
}

async function recognizeWishlist(dataUrl) {
  toast('正在识别商品...');
  const prompt = '请识别这张图片中的商品，提取商品名称和预估价格。格式：{"name":"商品名","price":价格数字}。只返回JSON。';
  const result = await recognizeImage(dataUrl, prompt);

  } catch(e) { toast('识别失败'); }
}

// ============================================================
// 事件绑定
// ============================================================
function bindEvents() {
  // 导航
  document.querySelectorAll('.nav-btn, .tabbar button').forEach(btn => {
    btn.addEventListener('click', () => switchModule(btn.dataset.mod));
  });
  
  // 每日一读标签
  document.querySelectorAll('#read-tabs .chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#read-tabs .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      loadDailyRead(btn.dataset.tab);
    });
  });
  
  // 记账
  $('fn-add-btn').addEventListener('click', () => $('fn-panel').classList.toggle('open'));
  $('fn-cancel').addEventListener('click', () => $('fn-panel').classList.remove('open'));
  $('fn-budget-btn').addEventListener('click', () => $('fn-budget-panel').classList.toggle('open'));
  $('fn-budget-cancel').addEventListener('click', () => $('fn-budget-panel').classList.remove('open'));
  $('fn-save').addEventListener('click', async () => {
    const type = $('fn-type').value;
    const amt = parseFloat($('fn-amt').value);
    const cat = $('fn-cat').value;
    const date = $('fn-date').value || today();
    const note = $('fn-note').value.trim();
    if (isNaN(amt) || amt <= 0) { toast('请输入有效金额'); return; }
    await saveExpense({ type, amount: amt, category: cat, date, note, created_at: new Date().toISOString() });
    $('fn-amt').value = ''; $('fn-note').value = ''; $('fn-panel').classList.remove('open');
  });
  $('fn-budget-save').addEventListener('click', async () => {
    const b = parseFloat($('fn-budget').value);
    if (isNaN(b) || b < 0) { toast('请输入预算'); return; }
    await sbInsert('budgets', { month: monthStr(), amount: b, created_at: new Date().toISOString() });
    toast('预算已保存'); $('fn-budget-panel').classList.remove('open'); loadFinance();
  });
  $('fn-snap-btn').addEventListener('click', () => $('fn-snap-input').click());
  $('fn-snap-input').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (f) { const d = await compressImage(f); if (d) await recognizeBill(d); }
  });
  
  // 习惯
  $('habit-add-btn').addEventListener('click', () => $('habit-panel').classList.toggle('open'));
  $('habit-cancel').addEventListener('click', () => $('habit-panel').classList.remove('open'));
  $('habit-save').addEventListener('click', async () => {
    const name = $('habit-name').value.trim();
    const type = $('habit-type').value;
    if (!name) { toast('请输入习惯名称'); return; }
    await sbInsert('habits', { name, type, created_at: new Date().toISOString() });
    toast('已添加'); $('habit-name').value = ''; $('habit-panel').classList.remove('open'); loadHabits();
  });
  
  // 健身
  $('fitness-add-btn').addEventListener('click', () => $('fitness-panel').classList.toggle('open'));
  $('fitness-cancel').addEventListener('click', () => $('fitness-panel').classList.remove('open'));
  $('fitness-plan-btn').addEventListener('click', () => $('fitness-plan-panel').classList.toggle('open'));
  $('fitness-plan-cancel').addEventListener('click', () => $('fitness-plan-panel').classList.remove('open'));
  $('fitness-save').addEventListener('click', async () => {
    const weight = parseFloat($('fitness-weight').value);
    const bodyFat = parseFloat($('fitness-fat').value) || null;
    const height = parseFloat($('fitness-height').value) || 175;
    const note = $('fitness-note').value.trim();
    if (isNaN(weight) || weight <= 0) { toast('请输入有效体重'); return; }
    const bmi = (weight / Math.pow(height/100, 2)).toFixed(1);
    await sbInsert('body_records', { weight, body_fat: bodyFat, height, bmi: parseFloat(bmi), note, date: today(), created_at: new Date().toISOString() });
    toast('已记录'); $('fitness-panel').classList.remove('open'); loadFitness();
  });
  $('plan-add').addEventListener('click', async () => {
    const exercise = $('plan-exercise').value.trim();
    const day = parseInt($('plan-day').value);
    if (!exercise) { toast('请输入运动项目'); return; }
    await sbInsert('workout_plans', { exercise, day, created_at: new Date().toISOString() });
    $('plan-exercise').value = ''; toast('已添加'); loadFitness();
  });
  
  // 待买
  $('wl-add-btn').addEventListener('click', () => $('wl-panel').classList.toggle('open'));
  $('wl-cancel').addEventListener('click', () => $('wl-panel').classList.remove('open'));
  $('wl-camera-btn').addEventListener('click', () => $('wl-camera-input').click());
  $('wl-upload-btn').addEventListener('click', () => $('wl-upload-input').click());
  $('wl-camera-input').addEventListener('change', async e => { const f = e.target.files[0]; if (f) { const d = await compressImage(f); if (d) await recognizeWishlist(d); } });
  $('wl-upload-input').addEventListener('change', async e => { const f = e.target.files[0]; if (f) { const d = await compressImage(f); if (d) await recognizeWishlist(d); } });
  $('wl-save').addEventListener('click', async () => {
    const name = $('wl-name').value.trim();
    if (!name) { toast('请输入商品名称'); return; }
    await saveWL({ name, price: parseFloat($('wl-price').value) || null, priority: $('wl-priority').value, category: $('wl-cat').value, note: $('wl-note').value.trim(), purchased: false, created_at: new Date().toISOString() });
    $('wl-name').value = ''; $('wl-price').value = ''; $('wl-note').value = ''; $('wl-panel').classList.remove('open');
  });
}
